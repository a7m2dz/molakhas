name: Molakhas Newsroom

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */2 * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/newsroom.yml'
      - 'scripts/newsroom/**'
      - 'src/data/sources.json'
      - 'src/pages/**'
      - 'src/layouts/**'
      - 'src/components/**'
      - 'src/styles/**'
      - 'astro.config.mjs'

permissions:
  contents: write

concurrency:
  group: molakhas-newsroom
  cancel-in-progress: false

jobs:
  newsroom:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FCC_BASE_URL: ${{ secrets.FCC_BASE_URL || vars.FCC_BASE_URL }}
      FCC_API_KEY: ${{ secrets.FCC_API_KEY }}
      FCC_MODEL: ${{ vars.FCC_MODEL }}
      FCC_TIMEOUT_MS: ${{ vars.FCC_TIMEOUT_MS || '60000' }}
      NEWSROOM_MAX_STORIES: ${{ vars.NEWSROOM_MAX_STORIES || '8' }}
      NEWSROOM_MAX_AGE_HOURS: ${{ vars.NEWSROOM_MAX_AGE_HOURS || '72' }}
      AUTO_PUBLISH_ENABLED: ${{ vars.AUTO_PUBLISH_ENABLED || 'true' }}
      AUTO_PUBLISH_MIN_SCORE: ${{ vars.AUTO_PUBLISH_MIN_SCORE || '88' }}
      AUTO_PUBLISH_MIN_TRUST: ${{ vars.AUTO_PUBLISH_MIN_TRUST || '88' }}
      AUTO_PUBLISH_MIN_CONFIDENCE: ${{ vars.AUTO_PUBLISH_MIN_CONFIDENCE || '78' }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Scan RSS sources
        run: npm run newsroom:dry

      - name: Check cloud FCC configuration
        id: fcc_config
        run: |
          if [ -n "$FCC_BASE_URL" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "Cloud FCC endpoint configured."
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Cloud FCC endpoint not configured; local Windows publisher is the primary generation path."
          fi

      - name: Verify cloud FCC connection
        id: fcc
        if: steps.fcc_config.outputs.ready == 'true'
        continue-on-error: true
        run: npm run fcc:test

      - name: Generate newsroom batch in cloud
        if: steps.fcc_config.outputs.ready == 'true' && steps.fcc.outcome == 'success'
        run: npm run newsroom

      - name: Cloud FCC unavailable notice
        if: steps.fcc_config.outputs.ready == 'true' && steps.fcc.outcome != 'success'
        run: echo "Cloud FCC is unreachable; skipping cloud generation. Local publisher can still generate through 127.0.0.1."

      - name: Build production site
        run: npm run build

      - name: Commit cloud-generated stories
        if: steps.fcc_config.outputs.ready == 'true' && steps.fcc.outcome == 'success'
        run: |
          if git diff --quiet -- src/data/stories.json; then
            echo "No newsroom changes."
            exit 0
          fi
          git config user.name "molakhas-newsroom[bot]"
          git config user.email "actions@users.noreply.github.com"
          git add src/data/stories.json
          git commit -m "newsroom: publish scheduled batch"
          git push
