name: Molakhas Newsroom

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */2 * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/newsroom.yml'
      - 'package.json'
      - 'scripts/newsroom/**'
      - 'src/data/**'
      - 'src/lib/**'
      - 'src/pages/**'
      - 'src/layouts/**'
      - 'src/components/**'
      - 'src/styles/**'
      - 'public/**'
      - 'astro.config.mjs'

permissions:
  contents: write

concurrency:
  group: molakhas-newsroom
  cancel-in-progress: true

jobs:
  newsroom:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OMNIROUTE_BASE_URL: ${{ secrets.OMNIROUTE_BASE_URL || vars.OMNIROUTE_BASE_URL }}
      OMNIROUTE_API_KEY: ${{ secrets.OMNIROUTE_API_KEY }}
      OMNIROUTE_MODEL: ${{ vars.OMNIROUTE_MODEL || 'auto/best-free' }}
      OMNIROUTE_FALLBACK_MODEL: ${{ vars.OMNIROUTE_FALLBACK_MODEL || 'auto' }}
      OMNIROUTE_TIMEOUT_MS: ${{ vars.OMNIROUTE_TIMEOUT_MS || '120000' }}
      NEWSROOM_MAX_STORIES: ${{ vars.NEWSROOM_MAX_STORIES || '8' }}
      NEWSROOM_MAX_AGE_HOURS: ${{ vars.NEWSROOM_MAX_AGE_HOURS || '72' }}
      NEWSROOM_MIN_TRAFFIC_SCORE: ${{ vars.NEWSROOM_MIN_TRAFFIC_SCORE || '35' }}
      AUTO_PUBLISH_ENABLED: ${{ vars.AUTO_PUBLISH_ENABLED || 'true' }}
      AUTO_PUBLISH_MIN_SCORE: ${{ vars.AUTO_PUBLISH_MIN_SCORE || '88' }}
      AUTO_PUBLISH_MIN_TRUST: ${{ vars.AUTO_PUBLISH_MIN_TRUST || '88' }}
      AUTO_PUBLISH_MIN_CONFIDENCE: ${{ vars.AUTO_PUBLISH_MIN_CONFIDENCE || '78' }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Rank traffic opportunities from RSS and radar
        run: npm run newsroom:dry

      - name: Check cloud OmniRoute configuration
        id: omni_config
        run: |
          if [ -n "$OMNIROUTE_BASE_URL" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "Cloud OmniRoute endpoint configured."
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Cloud OmniRoute endpoint not configured; Windows local publisher remains the primary story-generation path. Sports snapshots will still be refreshed in CI."
          fi

      - name: Verify cloud OmniRoute connection
        id: omni
        if: steps.omni_config.outputs.ready == 'true'
        continue-on-error: true
        run: npm run omniroute:test

      - name: Generate newsroom batch in cloud
        if: steps.omni_config.outputs.ready == 'true' && steps.omni.outcome == 'success'
        run: npm run newsroom

      - name: Cloud OmniRoute unavailable notice
        if: steps.omni_config.outputs.ready == 'true' && steps.omni.outcome != 'success'
        run: echo "Cloud OmniRoute is unreachable; skipping cloud story generation. Local publisher can still use 127.0.0.1:20128."

      - name: Build production site and media
        run: npm run build

      - name: Run prelaunch quality audit
        run: npm run audit:prelaunch

      # Single-writer rule:
      # - Windows publisher owns OmniRoute stories + article media.
      # - Scheduled/manual GitHub Actions owns match/event snapshots.
      # Push-triggered validation must never write generated data back to main,
      # otherwise a local publisher run can race the bot and create rebase conflicts.
      - name: Persist scheduled sports snapshots
        if: github.event_name != 'push'
        run: |
          if git diff --quiet -- src/data/matches.json src/data/today-events.json; then
            echo "No sports snapshot changes."
            exit 0
          fi
          git config user.name "molakhas-newsroom[bot]"
          git config user.email "actions@users.noreply.github.com"
          git add src/data/matches.json src/data/today-events.json
          git commit -m "newsroom: refresh sports snapshots"
          git push
