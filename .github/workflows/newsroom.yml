name: Molakhas Newsroom
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */2 * * *'
permissions:
  contents: write
concurrency:
  group: molakhas-newsroom
  cancel-in-progress: false
jobs:
  newsroom:
    runs-on: ubuntu-latest
    env:
      FCC_BASE_URL: ${{ secrets.FCC_BASE_URL || 'https://wheel-conflicts-pulse-arctic.trycloudflare.com/v1' }}
      FCC_API_KEY: ${{ secrets.FCC_API_KEY }}
      FCC_MODEL: ${{ vars.FCC_MODEL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - name: Check FCC configuration
        id: fcc
        run: |
          if [ -n "$FCC_BASE_URL" ] && [ -n "$FCC_API_KEY" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "FCC endpoint configured."
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "FCC_API_KEY is not configured yet; skipping newsroom."
          fi
      - name: Verify FCC
        if: steps.fcc.outputs.ready == 'true'
        run: npm run fcc:test
      - name: Generate newsroom batch
        if: steps.fcc.outputs.ready == 'true'
        run: npm run newsroom
        env:
          FCC_TIMEOUT_MS: ${{ vars.FCC_TIMEOUT_MS || '60000' }}
          NEWSROOM_MAX_STORIES: ${{ vars.NEWSROOM_MAX_STORIES || '8' }}
          AUTO_PUBLISH_ENABLED: ${{ vars.AUTO_PUBLISH_ENABLED || 'true' }}
          AUTO_PUBLISH_MIN_SCORE: ${{ vars.AUTO_PUBLISH_MIN_SCORE || '90' }}
          AUTO_PUBLISH_MIN_TRUST: ${{ vars.AUTO_PUBLISH_MIN_TRUST || '85' }}
      - name: Build
        if: steps.fcc.outputs.ready == 'true'
        run: npm run build
      - name: Commit generated stories
        if: steps.fcc.outputs.ready == 'true'
        run: |
          if git diff --quiet; then echo "No newsroom changes."; exit 0; fi
          git config user.name "molakhas-newsroom[bot]"
          git config user.email "actions@users.noreply.github.com"
          git add src/data/stories.json
          git commit -m "newsroom: publish scheduled batch"
          git push
