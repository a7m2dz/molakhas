name: Molakhas Newsroom

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */2 * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/newsroom.yml'
      - 'package.json'
      - 'scripts/newsroom/**'
      - 'src/data/**'
      - 'src/lib/**'
      - 'src/pages/**'
      - 'src/layouts/**'
      - 'src/components/**'
      - 'src/styles/**'
      - 'public/**'
      - 'astro.config.mjs'
      - 'worker/**'
      - 'wrangler.jsonc'

permissions:
  contents: write

concurrency:
  group: molakhas-newsroom
  cancel-in-progress: true

jobs:
  newsroom:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PUBLIC_SITE_URL: https://mulakhas.com
      OMNIROUTE_BASE_URL: ${{ vars.OMNIROUTE_BASE_URL || 'http://127.0.0.1:20128/v1' }}
      OMNIROUTE_API_KEY: ${{ secrets.OMNIROUTE_API_KEY }}
      OMNIROUTE_MODEL: ${{ vars.OMNIROUTE_MODEL || 'auto' }}
      OMNIROUTE_FALLBACK_MODEL: ${{ vars.OMNIROUTE_FALLBACK_MODEL || 'auto' }}
      OMNIROUTE_TIMEOUT_MS: ${{ vars.OMNIROUTE_TIMEOUT_MS || '120000' }}
      NEWSROOM_MAX_STORIES: ${{ vars.NEWSROOM_MAX_STORIES || '8' }}
      NEWSROOM_MAX_AGE_HOURS: ${{ vars.NEWSROOM_MAX_AGE_HOURS || '72' }}
      NEWSROOM_MIN_TRAFFIC_SCORE: ${{ vars.NEWSROOM_MIN_TRAFFIC_SCORE || '35' }}
      AUTO_PUBLISH_ENABLED: ${{ vars.AUTO_PUBLISH_ENABLED || 'true' }}
      AUTO_PUBLISH_MIN_SCORE: ${{ vars.AUTO_PUBLISH_MIN_SCORE || '88' }}
      AUTO_PUBLISH_MIN_TRUST: ${{ vars.AUTO_PUBLISH_MIN_TRUST || '88' }}
      AUTO_PUBLISH_MIN_CONFIDENCE: ${{ vars.AUTO_PUBLISH_MIN_CONFIDENCE || '78' }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install project dependencies
        run: npm install --no-audit --no-fund

      - name: Rank traffic opportunities from RSS and radar
        run: npm run newsroom:dry

      - name: Boot OmniRoute inside the cloud runner
        id: omni_boot
        if: github.event_name != 'push'
        shell: bash
        run: |
          set +e

          case "$OMNIROUTE_BASE_URL" in
            http://127.0.0.1:*|http://localhost:*)
              echo "Starting ephemeral OmniRoute on this GitHub runner..."
              ;;
            *)
              echo "Using configured remote OmniRoute endpoint: $OMNIROUTE_BASE_URL"
              echo "ready=true" >> "$GITHUB_OUTPUT"
              echo "mode=remote" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
          esac

          npm install -g omniroute@3.8.50 --no-audit --no-fund
          if [ $? -ne 0 ]; then
            echo "OmniRoute install failed; sports/data refresh will continue without AI story generation."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          nohup omniroute --no-open > /tmp/omniroute.log 2>&1 &
          echo $! > /tmp/omniroute.pid

          for attempt in $(seq 1 75); do
            if curl -fsS --max-time 4 "$OMNIROUTE_BASE_URL/models" > /tmp/omniroute-models.json 2>/dev/null; then
              echo "OmniRoute is ready on the GitHub runner."
              echo "ready=true" >> "$GITHUB_OUTPUT"
              echo "mode=ephemeral" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            if ! kill -0 "$(cat /tmp/omniroute.pid)" 2>/dev/null; then
              echo "OmniRoute process exited before becoming ready."
              break
            fi

            sleep 2
          done

          echo "OmniRoute did not become ready; continuing with non-AI refresh only."
          tail -n 200 /tmp/omniroute.log || true
          echo "ready=false" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Verify OmniRoute inference
        id: omni
        if: github.event_name != 'push' && steps.omni_boot.outputs.ready == 'true'
        continue-on-error: true
        run: npm run omniroute:test

      - name: Generate newsroom batch in cloud
        if: github.event_name != 'push' && steps.omni_boot.outputs.ready == 'true' && steps.omni.outcome == 'success'
        continue-on-error: true
        run: npm run newsroom

      - name: OmniRoute fallback notice
        if: github.event_name != 'push' && (steps.omni_boot.outputs.ready != 'true' || steps.omni.outcome != 'success')
        run: echo "AI generation was unavailable in this run; sports snapshots and site build continue normally."

      - name: Build production site and media
        run: npm run build

      - name: Run prelaunch quality audit
        run: npm run audit:prelaunch

      - name: Persist cloud newsroom state
        if: github.event_name != 'push'
        shell: bash
        run: |
          git config user.name "molakhas-newsroom[bot]"
          git config user.email "actions@users.noreply.github.com"

          # The runner starts from a clean checkout, so any changes under these
          # generated-data/media paths were produced by this newsroom run.
          git add -A src/data public/news-images public/brand

          if git diff --cached --quiet; then
            echo "No publishable newsroom changes."
            exit 0
          fi

          git commit -m "newsroom: cloud refresh $(date -u +'%Y-%m-%d %H:%M UTC')"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Notify search engines with IndexNow
        if: github.event_name != 'push'
        continue-on-error: true
        run: npm run indexnow
