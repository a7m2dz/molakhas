name: Molakhas Newsroom

on:
  workflow_dispatch:
  schedule:
    - cron: '7,37 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/newsroom.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/newsroom/**'
      - 'src/lib/**'
      - 'src/pages/**'
      - 'src/layouts/**'
      - 'src/components/**'
      - 'src/styles/**'
      - 'astro.config.mjs'
      - 'worker/**'
      - 'wrangler.jsonc'

permissions:
  contents: write

concurrency:
  group: molakhas-newsroom
  cancel-in-progress: true

jobs:
  primary-check:
    runs-on: ubuntu-latest
    outputs:
      active: ${{ steps.heartbeat.outputs.active }}
      age_minutes: ${{ steps.heartbeat.outputs.age_minutes }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Check Windows primary heartbeat
        id: heartbeat
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "active=false" >> "$GITHUB_OUTPUT"
            echo "age_minutes=forced" >> "$GITHUB_OUTPUT"
            echo "Manual dispatch forces a cloud cycle."
            exit 0
          fi

          if ! git fetch --quiet --depth=1 origin windows-heartbeat; then
            echo "active=false" >> "$GITHUB_OUTPUT"
            echo "age_minutes=missing" >> "$GITHUB_OUTPUT"
            echo "No Windows heartbeat branch; cloud fallback is active."
            exit 0
          fi

          if ! git show FETCH_HEAD:heartbeat.json > /tmp/molakhas-heartbeat.json 2>/dev/null; then
            echo "active=false" >> "$GITHUB_OUTPUT"
            echo "age_minutes=missing" >> "$GITHUB_OUTPUT"
            echo "Heartbeat file missing; cloud fallback is active."
            exit 0
          fi

          python3 - <<'PY'
          import json, os
          from datetime import datetime, timezone

          try:
              with open('/tmp/molakhas-heartbeat.json', 'r', encoding='utf-8') as f:
                  data = json.load(f)
              updated = datetime.fromisoformat(str(data.get('updatedAt', '')).replace('Z', '+00:00'))
              age = max(0.0, (datetime.now(timezone.utc) - updated.astimezone(timezone.utc)).total_seconds() / 60.0)
              healthy = data.get('source') == 'windows-primary' and data.get('omnirouteHealthy') is True
              active = healthy and age <= 20.0
              age_value = f'{age:.1f}'
          except Exception as exc:
              active = False
              age_value = 'invalid'
              print(f'Heartbeat parse error: {exc}')

          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as out:
              out.write(f"active={'true' if active else 'false'}\n")
              out.write(f"age_minutes={age_value}\n")
          print(f"Windows primary active={active}; heartbeat age={age_value} minutes")
          PY

      - name: Primary/fallback decision
        run: |
          echo "Windows primary active: ${{ steps.heartbeat.outputs.active }}"
          echo "Heartbeat age: ${{ steps.heartbeat.outputs.age_minutes }} minutes"
          if [ "${{ steps.heartbeat.outputs.active }}" = "true" ]; then
            echo "Windows is healthy; cloud newsroom stands by."
          else
            echo "Windows is unavailable/stale; cloud newsroom will take over."
          fi

  newsroom:
    needs: primary-check
    if: needs.primary-check.outputs.active != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      PUBLIC_SITE_URL: https://mulakhas.com
      OMNIROUTE_SERVER_HOST: 127.0.0.1
      REQUIRE_API_KEY: 'false'
      OMNIROUTE_BASE_URL: ${{ vars.OMNIROUTE_BASE_URL || 'http://127.0.0.1:20128/v1' }}
      OMNIROUTE_API_KEY: ${{ secrets.OMNIROUTE_API_KEY || 'sk_omniroute' }}
      OMNIROUTE_MODEL: auto/best-free
      OMNIROUTE_FALLBACK_MODEL: ${{ vars.OMNIROUTE_FALLBACK_MODEL || 'auto' }}
      OMNIROUTE_TIMEOUT_MS: ${{ vars.OMNIROUTE_TIMEOUT_MS || '60000' }}
      NEWSROOM_MAX_STORIES: ${{ vars.NEWSROOM_MAX_STORIES || '3' }}
      NEWSROOM_MAX_ENTERTAINMENT_STORIES: ${{ vars.NEWSROOM_MAX_ENTERTAINMENT_STORIES || '2' }}
      NEWSROOM_MAX_AGE_HOURS: ${{ vars.NEWSROOM_MAX_AGE_HOURS || '72' }}
      NEWSROOM_MIN_TRAFFIC_SCORE: ${{ vars.NEWSROOM_MIN_TRAFFIC_SCORE || '35' }}
      AUTO_PUBLISH_ENABLED: ${{ vars.AUTO_PUBLISH_ENABLED || 'true' }}
      AUTO_PUBLISH_MIN_SCORE: ${{ vars.AUTO_PUBLISH_MIN_SCORE || '88' }}
      AUTO_PUBLISH_MIN_TRUST: ${{ vars.AUTO_PUBLISH_MIN_TRUST || '88' }}
      AUTO_PUBLISH_MIN_CONFIDENCE: ${{ vars.AUTO_PUBLISH_MIN_CONFIDENCE || '78' }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install project dependencies
        shell: bash
        run: |
          set -e
          for attempt in 1 2 3; do
            if npm install --no-audit --no-fund; then
              exit 0
            fi
            echo "Project dependency install attempt $attempt failed; retrying..."
            sleep $((attempt * 10))
          done
          exit 1

      - name: Rank traffic opportunities from RSS and radar
        continue-on-error: true
        timeout-minutes: 8
        run: npm run newsroom:dry

      - name: Boot OmniRoute inside the cloud runner
        id: omni_boot
        shell: bash
        run: |
          set +e

          case "$OMNIROUTE_BASE_URL" in
            http://127.0.0.1:*|http://localhost:*)
              echo "Starting ephemeral OmniRoute on this GitHub runner..."
              ;;
            *)
              echo "Using configured remote OmniRoute endpoint: $OMNIROUTE_BASE_URL"
              echo "ready=true" >> "$GITHUB_OUTPUT"
              echo "mode=remote" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
          esac

          installed=false
          for attempt in 1 2 3; do
            if npm install -g omniroute@3.8.50 --no-audit --no-fund; then
              installed=true
              break
            fi
            echo "OmniRoute install attempt $attempt failed; retrying..."
            sleep $((attempt * 15))
          done

          if [ "$installed" != "true" ]; then
            echo "OmniRoute install failed; data refresh and site build will continue without AI story generation."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          nohup omniroute --no-open > /tmp/omniroute.log 2>&1 &
          echo $! > /tmp/omniroute.pid

          for attempt in $(seq 1 180); do
            if curl -fsS --max-time 4 -H "Authorization: Bearer $OMNIROUTE_API_KEY" "$OMNIROUTE_BASE_URL/models" > /tmp/omniroute-models.json 2>/dev/null; then
              echo "OmniRoute API is ready on the GitHub runner."
              echo "ready=true" >> "$GITHUB_OUTPUT"
              echo "mode=ephemeral" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 2
          done

          echo "OmniRoute API did not become ready; continuing with non-AI refresh only."
          tail -n 200 /tmp/omniroute.log || true
          echo "ready=false" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Verify OmniRoute inference
        id: omni
        if: steps.omni_boot.outputs.ready == 'true'
        continue-on-error: true
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if npm run omniroute:test; then
              exit 0
            fi
            echo "OmniRoute inference attempt $attempt failed; retrying..."
            sleep $((attempt * 10))
          done
          exit 1

      - name: Generate newsroom batch in cloud
        id: generate
        if: steps.omni_boot.outputs.ready == 'true' && steps.omni.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 20
        run: npm run newsroom

      - name: OmniRoute fallback notice
        if: steps.omni_boot.outputs.ready != 'true' || steps.omni.outcome != 'success'
        run: echo "AI generation was unavailable in this cycle; sports snapshots, source images, build and the next scheduled cycle continue normally."

      - name: Build production site and media
        timeout-minutes: 12
        shell: bash
        run: |
          for attempt in 1 2; do
            if npm run build; then
              exit 0
            fi
            echo "Production build attempt $attempt failed; retrying once..."
            sleep 15
          done
          exit 1

      - name: Run prelaunch quality audit
        timeout-minutes: 6
        run: npm run audit:prelaunch

      - name: Persist cloud newsroom state
        id: persist
        shell: bash
        run: |
          set -e
          git config user.name "molakhas-newsroom[bot]"
          git config user.email "actions@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No publishable newsroom changes in this cycle."
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git commit -m "newsroom: cloud refresh $(date -u +'%Y-%m-%d %H:%M UTC')"

          for attempt in 1 2 3; do
            if git pull --rebase --autostash origin main && git push origin HEAD:main; then
              echo "published=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Publish attempt $attempt failed; retrying..."
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 10))
          done

          exit 1

      - name: Notify search engines with IndexNow
        if: steps.persist.outputs.published == 'true'
        continue-on-error: true
        run: npm run indexnow

      - name: Cycle status
        if: always()
        shell: bash
        run: |
          echo "Molakhas cloud fallback cycle finished at $(date -u +'%Y-%m-%d %H:%M:%S UTC')."
          echo "Windows heartbeat age: ${{ needs.primary-check.outputs.age_minutes }} minutes"
          echo "OmniRoute ready: ${{ steps.omni_boot.outputs.ready }}"
          echo "Inference outcome: ${{ steps.omni.outcome }}"
          echo "News generation outcome: ${{ steps.generate.outcome }}"
          echo "Published changes: ${{ steps.persist.outputs.published }}"
