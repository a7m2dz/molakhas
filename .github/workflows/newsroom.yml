name: Molakhas Newsroom

on:
  workflow_dispatch:
  schedule:
    - cron: '7,37 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/newsroom.yml'
      - 'package.json'
      - 'scripts/newsroom/**'
      - 'src/data/**'
      - 'src/lib/**'
      - 'src/pages/**'
      - 'src/layouts/**'
      - 'src/components/**'
      - 'src/styles/**'
      - 'public/**'
      - 'astro.config.mjs'
      - 'worker/**'
      - 'wrangler.jsonc'

permissions:
  contents: write

concurrency:
  group: molakhas-newsroom
  cancel-in-progress: false

jobs:
  newsroom:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      PUBLIC_SITE_URL: https://mulakhas.com
      OMNIROUTE_SERVER_HOST: 127.0.0.1
      REQUIRE_API_KEY: 'false'
      OMNIROUTE_BASE_URL: ${{ vars.OMNIROUTE_BASE_URL || 'http://127.0.0.1:20128/v1' }}
      OMNIROUTE_API_KEY: ${{ secrets.OMNIROUTE_API_KEY || 'sk_omniroute' }}
      OMNIROUTE_MODEL: ${{ vars.OMNIROUTE_MODEL || 'auto' }}
      OMNIROUTE_FALLBACK_MODEL: ${{ vars.OMNIROUTE_FALLBACK_MODEL || 'auto' }}
      OMNIROUTE_TIMEOUT_MS: ${{ vars.OMNIROUTE_TIMEOUT_MS || '120000' }}
      NEWSROOM_MAX_STORIES: ${{ vars.NEWSROOM_MAX_STORIES || '8' }}
      NEWSROOM_MAX_AGE_HOURS: ${{ vars.NEWSROOM_MAX_AGE_HOURS || '72' }}
      NEWSROOM_MIN_TRAFFIC_SCORE: ${{ vars.NEWSROOM_MIN_TRAFFIC_SCORE || '35' }}
      AUTO_PUBLISH_ENABLED: ${{ vars.AUTO_PUBLISH_ENABLED || 'true' }}
      AUTO_PUBLISH_MIN_SCORE: ${{ vars.AUTO_PUBLISH_MIN_SCORE || '88' }}
      AUTO_PUBLISH_MIN_TRUST: ${{ vars.AUTO_PUBLISH_MIN_TRUST || '88' }}
      AUTO_PUBLISH_MIN_CONFIDENCE: ${{ vars.AUTO_PUBLISH_MIN_CONFIDENCE || '78' }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install project dependencies
        shell: bash
        run: |
          set -e
          for attempt in 1 2 3; do
            if npm install --no-audit --no-fund; then
              exit 0
            fi
            echo "Project dependency install attempt $attempt failed; retrying..."
            sleep $((attempt * 10))
          done
          exit 1

      - name: Rank traffic opportunities from RSS and radar
        continue-on-error: true
        run: npm run newsroom:dry

      - name: Boot OmniRoute inside the cloud runner
        id: omni_boot
        shell: bash
        run: |
          set +e

          case "$OMNIROUTE_BASE_URL" in
            http://127.0.0.1:*|http://localhost:*)
              echo "Starting ephemeral OmniRoute on this GitHub runner..."
              ;;
            *)
              echo "Using configured remote OmniRoute endpoint: $OMNIROUTE_BASE_URL"
              echo "ready=true" >> "$GITHUB_OUTPUT"
              echo "mode=remote" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
          esac

          installed=false
          for attempt in 1 2 3; do
            if npm install -g omniroute@3.8.50 --no-audit --no-fund; then
              installed=true
              break
            fi
            echo "OmniRoute install attempt $attempt failed; retrying..."
            sleep $((attempt * 15))
          done

          if [ "$installed" != "true" ]; then
            echo "OmniRoute install failed; data refresh and site build will continue without AI story generation."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          nohup omniroute --no-open > /tmp/omniroute.log 2>&1 &
          echo $! > /tmp/omniroute.pid

          for attempt in $(seq 1 180); do
            if curl -fsS --max-time 4 -H "Authorization: Bearer $OMNIROUTE_API_KEY" "$OMNIROUTE_BASE_URL/models" > /tmp/omniroute-models.json 2>/dev/null; then
              echo "OmniRoute API is ready on the GitHub runner."
              echo "ready=true" >> "$GITHUB_OUTPUT"
              echo "mode=ephemeral" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 2
          done

          echo "OmniRoute API did not become ready; continuing with non-AI refresh only."
          tail -n 200 /tmp/omniroute.log || true
          echo "ready=false" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Verify OmniRoute inference
        id: omni
        if: steps.omni_boot.outputs.ready == 'true'
        continue-on-error: true
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if npm run omniroute:test; then
              exit 0
            fi
            echo "OmniRoute inference attempt $attempt failed; retrying..."
            sleep $((attempt * 10))
          done
          exit 1

      - name: Generate newsroom batch in cloud
        id: generate
        if: steps.omni_boot.outputs.ready == 'true' && steps.omni.outcome == 'success'
        continue-on-error: true
        run: npm run newsroom

      - name: OmniRoute fallback notice
        if: steps.omni_boot.outputs.ready != 'true' || steps.omni.outcome != 'success'
        run: echo "AI generation was unavailable in this cycle; sports snapshots, source images, build and the next scheduled cycle continue normally."

      - name: Build production site and media
        shell: bash
        run: |
          for attempt in 1 2; do
            if npm run build; then
              exit 0
            fi
            echo "Production build attempt $attempt failed; retrying once..."
            sleep 15
          done
          exit 1

      - name: Run prelaunch quality audit
        run: npm run audit:prelaunch

      - name: Persist cloud newsroom state
        id: persist
        shell: bash
        run: |
          set -e
          git config user.name "molakhas-newsroom[bot]"
          git config user.email "actions@users.noreply.github.com"

          git add -A src/data public/news-images public/brand

          if git diff --cached --quiet; then
            echo "No publishable newsroom changes in this cycle."
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git commit -m "newsroom: cloud refresh $(date -u +'%Y-%m-%d %H:%M UTC')"

          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              echo "published=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Publish attempt $attempt failed; retrying..."
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 10))
          done

          exit 1

      - name: Notify search engines with IndexNow
        if: steps.persist.outputs.published == 'true'
        continue-on-error: true
        run: npm run indexnow

      - name: Cycle status
        if: always()
        shell: bash
        run: |
          echo "Molakhas cloud newsroom cycle finished at $(date -u +'%Y-%m-%d %H:%M:%S UTC')."
          echo "OmniRoute ready: ${{ steps.omni_boot.outputs.ready }}"
          echo "Inference outcome: ${{ steps.omni.outcome }}"
          echo "News generation outcome: ${{ steps.generate.outcome }}"
          echo "Published changes: ${{ steps.persist.outputs.published }}"
