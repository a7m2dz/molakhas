name: Cloud OmniRoute Smoke

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cloud-omniroute-smoke.yml'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OMNIROUTE_SERVER_HOST: 127.0.0.1
      REQUIRE_API_KEY: 'false'
      OMNIROUTE_BASE_URL: http://127.0.0.1:20128/v1
      OMNIROUTE_API_KEY: sk_omniroute
      OMNIROUTE_MODEL: auto
      OMNIROUTE_FALLBACK_MODEL: auto
      OMNIROUTE_TIMEOUT_MS: 120000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install project dependencies
        run: npm install --no-audit --no-fund
      - name: Install and start local OmniRoute
        shell: bash
        run: |
          set -e
          npm install -g omniroute@3.8.50 --no-audit --no-fund
          nohup omniroute --no-open > /tmp/omniroute.log 2>&1 &
          echo $! > /tmp/omniroute.pid

          for attempt in $(seq 1 180); do
            if curl -fsS --max-time 4 -H "Authorization: Bearer sk_omniroute" "$OMNIROUTE_BASE_URL/models" > /tmp/omniroute-models.json 2>/dev/null; then
              echo "OmniRoute local API is ready."
              exit 0
            fi
            sleep 2
          done

          echo "OmniRoute local API did not become ready in time."
          tail -n 200 /tmp/omniroute.log || true
          exit 1
      - name: Test real Arabic inference through auto
        run: npm run omniroute:test
